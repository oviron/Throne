# Upstream build.yml steps for the two platforms this fork ships: macOS arm64 and Windows x64.
name: oviron release
on:
  push:
    tags:
      - "*-oviron.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. 1.3.2-oviron.3; empty builds without publishing"
        required: false

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  macos-arm64:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      DEST: ${{ github.workspace }}/deployment/darwin-arm64
      DEST_SUFFIX: darwin-arm64
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Golang
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            core/go.sum
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Installing protoc-gen-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Build golang parts
        shell: bash
        run: |
          GOOS=darwin GOARCH=arm64 ./script/build_go.sh
          # deploy_macos.sh takes the core from the tarball the upstream build-go job uploads.
          mkdir -p download-artifact
          tar czf download-artifact/artifacts.tgz ./deployment
      - name: Checking out the web dashboard
        uses: actions/checkout@v7.0.1
        with:
          repository: SagerNet/sing-box-dashboard
          ref: gh-pages
          path: dashboard-src
      - name: Bundling the web dashboard
        shell: bash
        run: |
          rm -rf dashboard-src/.git
          cp -R dashboard-src/. res/dashboard/
          test -f res/dashboard/index.html
      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: "6.11.2"
          setup-python: true
          cache: true
          cache-key-prefix: QtCache-darwin-arm64
      - name: Generate MakeFile and Build
        shell: bash
        env:
          INPUT_VERSION: ${{ env.TAG }}
        run: |
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DNKR_PACKAGE_MACOS=1 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 -DCMAKE_OSX_ARCHITECTURES=arm64 ..
          ninja
          cd ..
          ./script/deploy_macos.sh
      - name: Pack
        shell: bash
        run: |
          NAME="Throne-${TAG:-${GITHUB_SHA::8}}-macos-arm64.zip"
          mkdir -p .pack/Throne out
          mv "$DEST/Throne.app" .pack/Throne/
          rm -rf .pack/Throne/Throne.app/Contents/MacOS/Throne.dSYM
          (cd .pack && zip -q --symlinks -r "../out/$NAME" Throne)
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-macos-arm64
          path: out
          compression-level: 0

  windows-amd64-go:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      DEST: ${{ github.workspace }}/deployment/windows-amd64
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Golang
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            core/go.sum
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Installing protoc-gen-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Build golang parts
        shell: bash
        run: |
          GOOS=windows GOARCH=amd64 ./script/build_go.sh
          tar czf artifacts.tgz ./deployment
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: core-windows-amd64
          path: artifacts.tgz
          compression-level: 0

  windows-amd64:
    needs: windows-amd64-go
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      DEST: ${{ github.workspace }}/deployment/windows-amd64
      DEST_SUFFIX: windows-amd64
      ARCH: x64
    steps:
      - name: Checking out sources
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Checking out the web dashboard
        uses: actions/checkout@v7.0.1
        with:
          repository: SagerNet/sing-box-dashboard
          ref: gh-pages
          path: dashboard-src
      - name: Bundling the web dashboard
        shell: bash
        run: |
          rm -rf dashboard-src/.git || true
          cp -R dashboard-src/. res/dashboard/
          test -f res/dashboard/index.html
      - name: Install MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: core-windows-amd64
          path: download-artifact
      - name: Download Qt and OpenSSL
        shell: bash
        run: |
          curl -L -o qt.7z https://github.com/throneproj/buildqt/releases/download/Qt_6.11.2/Qt_6.11.2_x64.7z
          curl -L -o openssl.7z https://github.com/throneproj/env_windows_legacy/releases/download/latest/openssl_x64.7z
      - name: Generate MakeFile and Build
        shell: bash
        env:
          INPUT_VERSION: ${{ env.TAG }}
        run: |
          7z x qt.7z
          7z x openssl.7z
          export CMAKE_PREFIX_PATH=$PWD/Qt/lib/cmake
          export OPENSSL_ROOT_DIR=$PWD/openssl
          mkdir build
          cd build
          curl -fLso srslist.h "https://raw.githubusercontent.com/throneproj/routeprofiles/rule-set/srslist.h"
          cmake -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo ..
          ninja
          cd ..
          ./script/deploy_windows.sh
      - name: Pack
        shell: bash
        run: |
          # pack_release.sh zip_dir: the Throne/ root without debug symbols, 7-Zip on Windows runners.
          NAME="Throne-${TAG:-${GITHUB_SHA::8}}-windows64.zip"
          mkdir -p .pack out
          cp -r deployment/windows-amd64 .pack/Throne
          rm -f .pack/Throne/*.pdb
          (cd .pack && 7z a -tzip -mx=5 -bd -bso0 "../out/$NAME" Throne)
      - name: Uploading Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-windows64
          path: out
          compression-level: 0

  release:
    if: github.event_name == 'push' || inputs.tag != ''
    needs:
      - macos-arm64
      - windows-amd64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: out
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l out
          gh release create "$TAG" out/* --verify-tag --title "$TAG" \
            --notes "Throne ${TAG%%-oviron.*} for macOS arm64 and Windows x64 with a Firefox 158 TLS fingerprint. See [FORK.md](https://github.com/oviron/Throne/blob/$TAG/FORK.md)."
